name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e 'agents[dev]'
      - working-directory: agents
        run: |
          ruff check .
          ruff format --check .
          pytest -q

  smoke:
    needs: [java, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make up
      - run: make smoke
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: make clean
