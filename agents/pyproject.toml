[project]
name = "applyops-agents"
version = "0.1.0"
description = "ApplyOps Python agents worker (Temporal task queue: agents-tq)"
requires-python = ">=3.12"
dependencies = [
    "temporalio==1.36.1",
    "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "jsonschema==4.26.0",
    "pyyaml==6.0.3",
]

[project.scripts]
applyops-agents-worker = "applyops_agents.worker:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
