spring:
  application:
    name: orchestrator
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:applyops}
    username: ${DB_USER:applyops}
    password: ${DB_PASSWORD:applyops}
  flyway:
    enabled: true
  temporal:
    namespace: ${TEMPORAL_NAMESPACE:default}
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    workers-auto-discovery:
      packages:
        - dev.applyops.orchestrator
