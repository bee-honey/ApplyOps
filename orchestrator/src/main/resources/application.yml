spring:
  application:
    name: orchestrator
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:applyops}
    username: ${DB_USER:applyops}
    password: ${DB_PASSWORD:applyops}
  flyway:
    enabled: true
  temporal:
    namespace: ${TEMPORAL_NAMESPACE:default}
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    workers-auto-discovery:
      packages:
        - dev.applyops.orchestrator

applyops:
  gmail:
    credentials-file: ${GMAIL_CREDENTIALS_FILE:data/gmail-credentials.json}
    token-dir: ${GMAIL_TOKEN_DIR:data/gmail-token}
  discovery:
    # Keep off until `make gmail-auth` has been run.
    schedule-enabled: ${DISCOVERY_SCHEDULE_ENABLED:false}
    interval: ${DISCOVERY_INTERVAL:15m}
    initial-lookback-days: 14
    max-initial-messages: 100
    linkedin-senders:
      - jobalerts-noreply@linkedin.com
      - jobs-noreply@linkedin.com
      - jobs-listings@linkedin.com
    jobright-senders:
      - jobright.ai
